[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trader"
version = "0.2.0"
description = "Bender - automated cryptocurrency trading bot for Bitvavo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "python-bitvavo-api>=1.4.3",
    "python-dotenv>=1.0.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pandas-ta>=0.4.67b0",
    "textual>=0.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4",
    "mypy>=1.3.0",
]

[project.scripts]
trader = "trader.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit the live Bitvavo API (deselected by default; run with -m integration)",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
